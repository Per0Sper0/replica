services:
  - type: web
    name: replica-studio
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: replica-media
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 24

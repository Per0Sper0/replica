services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: replica
      POSTGRES_USER: replica
      POSTGRES_PASSWORD: replica_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replica -d replica"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
